<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151716">
  <title>{% block title %}Любимые фильмы — личный киножурнал{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<a class="skip-link" href="#main">Перейти к содержимому</a>

<footer class="wrap"><a class="brand" href="/">Любимые фильмы<span class="brand-dot">.</span></a><p>Личный киножурнал. О кино, которое остаётся с нами.</p><a href="#main">Наверх ↑</a></footer>
